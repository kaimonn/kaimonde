<!DOCTYPE html>
<html lang="ja">
<head>
  <title>旅行記ブログ</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- メインCSS -->
  <link rel="stylesheet" href="css/style.css" />

</head>
<body>

  <!-- ヘッダーはJSで読み込まれる -->

  <main>
    <h2>パリ旅行 2025年1月</h2>

    <p>パリでの素敵な1日を記録します。写真と地図を使って振り返ります。</p>

    <img class="photo" src="https://res.cloudinary.com/xxxx/image/upload/v1234/paris01.jpg" alt="エッフェル塔">
    <img class="photo" src="https://res.cloudinary.com/xxxx/image/upload/v1234/louvre01.jpg" alt="ルーブル美術館">

    <div id="map"></div>
  </main>

  <footer>
    <p>© 2026 旅行記ブログ</p>
  </footer>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ヘッダー -->
  <script src="js/header.js"></script>

  //<!-- メイン -->
  <!--<script src="js/main.js"></script>-->



  <script>
    // 地図初期化
    const map = L.map('map').setView([48.8566, 2.3522], 13);

    // タイルレイヤー
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // マーカー例
    L.marker([48.8584, 2.2945]).addTo(map)
      .bindPopup('エッフェル塔')
      .openPopup();

    L.marker([48.8606, 2.3376]).addTo(map)
      .bindPopup('ルーブル美術館');
  </script>

</body>
</html>
