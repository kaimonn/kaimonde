<!-- index.html -->
<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KaiMonde</title>
  
  <!-- Tailwind CSS CDN (最新版) -->
　<script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (読みやすい日本語対応フォント) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans JP', 'Inter', system-ui, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <!-- ヘッダー（sticky + 影で浮き感） -->
-->
<div id="header-container"></div>

  <!-- メインコンテンツ（仮） -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-6">ようこそ、KAITOの世界へ</h1>
    <p class="text-xl text-gray-600 max-w-3xl">
      ここでは日々の気づきや技術的なメモ、 旅行の記録などをゆるく書いています。
    </p>
    <!-- ここに記事カードなどを後で追加 -->
  </main>

  <!-- シンプルなフッター -->
  <footer class="bg-gray-900 text-gray-400 py-8 text-center">
    <p>&copy; 2026 KaiMonde. All rights reserved.</p>
  </footer>

  <!-- JavaScript（言語切り替え + モバイルメニュー） -->
  <script>
  // ヘッダーを非同期で読み込み
  fetch('components/header.html')
    .then(response => {
      if (!response.ok) throw new Error('ヘッダー読み込み失敗');
      return response.text();
    })
    .then(html => {
      document.getElementById('header-container').innerHTML = html;

      // 読み込み後にモバイルメニューなどのイベントを再設定
      const btn = document.getElementById('mobile-menu-btn');
      const menu = document.getElementById('mobile-menu');
      if (btn && menu) {
        btn.addEventListener('click', () => {
          menu.classList.toggle('hidden');
        });
      }

      // 言語セレクタのイベントもここで再設定（必要なら）
      const langSelect = document.getElementById('lang-select');
      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          // 将来の言語切り替えロジック
          console.log('言語変更:', e.target.value);
        });
      }
    })
    .catch(error => {
      console.error('エラー:', error);
      // フォールバック（オプション）
      document.getElementById('header-container').innerHTML = '<p>ヘッダー読み込みエラー</p>';
    });
</script>

    
  </script>
</body>
</html>
