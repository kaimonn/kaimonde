<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KaiMonde - Home</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  #articles-map { height: 600px; }
</style>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

  <!-- 左サイドバー -->
  <div id="sidebar" class="w-1/3 bg-white overflow-y-auto p-6 border-r">
    <h2 class="text-2xl font-bold mb-4">記事一覧</h2>
    <div id="article-list">
      <p class="text-gray-500">マーカーをクリックしてください</p>
    </div>
  </div>

  <!-- 地図 -->
  <div class="w-2/3">
    <div id="articles-map"></div>
  </div>

</div>

<script>
const map = L.map('articles-map').setView([46.0,2.0],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap'
}).addTo(map);

let allFeatures = [];
let currentLayer;

fetch("/kaimonde/data/articles.geojson")
.then(res=>res.json())
.then(data=>{
  allFeatures = data.features;
  renderMarkers();
  map.on("zoomend", renderMarkers);
});

function getGroupKey(props, zoom){
  if(zoom < 6){
    return props.country || "global";
  }
  if(zoom < 9){
    return props.region || props.country;
  }
  return props.city || props.region || props.country;
}

function getRepresentativeFeature(group){
  return group[0]; // 代表点は最初の記事の座標を使用
}

function renderMarkers(){

  if(currentLayer) currentLayer.remove();

  const zoom = map.getZoom();
  const groups = {};

  allFeatures.forEach(f=>{
    const key = getGroupKey(f.properties, zoom);
    if(!groups[key]) groups[key] = [];
    groups[key].push(f);
  });

  currentLayer = L.layerGroup();

  Object.values(groups).forEach(group=>{
    const rep = getRepresentativeFeature(group);
    const latlng = [
      rep.geometry.coordinates[1],
      rep.geometry.coordinates[0]
    ];

    const marker = L.marker(latlng).addTo(currentLayer);

    marker.on("click", ()=>{
      showArticles(group);
    });

  });

  currentLayer.addTo(map);
}

function showArticles(group){

  const container = document.getElementById("article-list");
  container.innerHTML = "";

  group.sort((a,b)=>new Date(b.properties.date)-new Date(a.properties.date));

  group.forEach(f=>{
    const p = f.properties;

    const card = document.createElement("a");
    card.href = p.url;
    card.className = "block border-b py-4 hover:bg-gray-50 transition";

    card.innerHTML = `
      <p class="text-sm text-gray-500">${p.date}</p>
      <h3 class="font-semibold text-lg">${p.title}</h3>
      <p class="text-gray-600 text-sm mt-1">${p.description}</p>
      <p class="text-xs text-gray-400 mt-2">${(p.city||'') + ' ' + (p.country||'')}</p>
    `;

    container.appendChild(card);
  });
}
</script>

</body>
</html>
