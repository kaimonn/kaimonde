<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KaiMonde - ホーム</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { font-family: 'Noto Sans JP', sans-serif; }

#articles-map {
  height: 600px;
  border-radius: 0.75rem;
}

.article-badge {
  background: #2563eb;
  color: white;
  border-radius: 9999px;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  border: 3px solid white;
  transition: transform .15s ease;
}
.article-badge:hover {
  transform: scale(1.15);
}
</style>
</head>

<body class="bg-gray-50 text-gray-900">

<!-- 共通Header -->
<div id="header"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-16">


<section class="text-left">
<h1 class="text-4xl md:text-5xl font-bold mb-6">ようこそ、KAITOの世界へ</h1>
<p class="text-xl text-gray-700 max-w-3xl mb-6">
ここでは日々の気づきや技術的なメモ、旅の記録などをゆるく書いています。
地図から記事を探せます。
</p>
</section>

<!-- 地図セクション -->
<section>
<h2 class="text-3xl font-bold mb-6">記事マップ</h2>

<div class="flex gap-6">

  <!-- サイドバー -->
  <div id="sidebar"
       class="w-1/3 bg-white rounded-xl shadow p-6 overflow-y-auto"
       style="max-height:600px;">
    <h3 class="text-xl font-semibold mb-4">記事一覧</h3>
    <div id="article-list">
      <p class="text-gray-400">マーカーをクリックしてください</p>
    </div>
  </div>

  <!-- 地図 -->
  <div class="w-2/3">
    <div id="articles-map"></div>
  </div>

</div>
</section>

<!-- 最近の記事 -->
<section>
<h2 class="text-3xl font-bold mb-6">最近の記事</h2>
<div id="recent-articles"
     class="grid gap-8 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></div>
<p id="no-articles" class="text-gray-500 hidden">まだ記事がありません。</p>
</section>

</main>

<!-- 共通Footer -->
<div id="footer"></div>

<script>

const map = L.map('articles-map').setView([46.0,2.0],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap'
}).addTo(map);

let allFeatures = [];
let currentLayer;

fetch("/kaimonde/data/articles.geojson")
.then(res=>res.json())
.then(data=>{

  allFeatures = data.features;

  renderRecentArticles();
  renderMarkers();

  map.on("zoomend", renderMarkers);

});

function getGroupKey(props, zoom){
  if(zoom < 6) return props.country || "global";
  if(zoom < 9) return props.region || props.country;
  return props.city || props.region || props.country;
}

function renderMarkers(){

  if(currentLayer) currentLayer.remove();

  const zoom = map.getZoom();
  const groups = {};

  allFeatures.forEach(f=>{
    const key = getGroupKey(f.properties, zoom);
    if(!groups[key]) groups[key] = [];
    groups[key].push(f);
  });

  currentLayer = L.layerGroup();

  Object.values(groups).forEach(group=>{

    const rep = group[0];
    const latlng = [
      rep.geometry.coordinates[1],
      rep.geometry.coordinates[0]
    ];

    const count = group.length;
    const label = count > 99 ? "99+" : count;

    const icon = L.divIcon({
      html:`<div class="article-badge">${label}</div>`,
      className:"",
      iconSize:[38,38],
      iconAnchor:[19,19]
    });

    const marker = L.marker(latlng,{icon}).addTo(currentLayer);

    marker.on("click",()=>showArticles(group));

  });

  currentLayer.addTo(map);
}

function showArticles(group){

  const container = document.getElementById("article-list");
  container.innerHTML = "";

  group.sort((a,b)=>new Date(b.properties.date)-new Date(a.properties.date));

  group.forEach(f=>{
    const p = f.properties;

    const card = document.createElement("a");
    card.href = p.url;
    card.className="block border-b py-4 hover:bg-gray-50 transition";

    card.innerHTML=`
      <p class="text-sm text-gray-500">${p.date}</p>
      <h4 class="font-semibold text-lg">${p.title}</h4>
      <p class="text-gray-600 text-sm mt-1">${p.description}</p>
      <p class="text-xs text-gray-400 mt-2">
        📍${(p.city||'')} ${(p.region||'')} ${(p.country||'')}
      </p>
    `;

    container.appendChild(card);
  });
}

function renderRecentArticles(){

  const container = document.getElementById("recent-articles");
  const noMsg = document.getElementById("no-articles");

  if(!allFeatures.length){
    noMsg.classList.remove("hidden");
    return;
  }

  const sorted = [...allFeatures]
    .sort((a,b)=>new Date(b.properties.date)-new Date(a.properties.date))
    .slice(0,6);

  sorted.forEach(f=>{
    const p = f.properties;

    const card = document.createElement("a");
    card.href = p.url;
    card.className="block bg-white p-6 rounded-xl shadow hover:shadow-md transition";

    card.innerHTML=`
      <p class="text-sm text-gray-500">
        ${p.date} ・ ${p.category.join(', ')}
      </p>
      <h3 class="text-xl font-semibold mt-2">${p.title}</h3>
      <p class="text-gray-600 mt-3">${p.description}</p>
      <p class="text-xs text-gray-400 mt-2">
        📍${(p.city||'')} ${(p.region||'')} ${(p.country||'')}
      </p>
    `;

    container.appendChild(card);
  });
}

</script>

<!-- 共通コンポーネント -->
<script src="/kaimonde/components/load-components.js"></script>

</body>
</html>
