<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KaiMonde</title>
  
  <!-- Tailwind CSS CDN (最新版) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (読みやすい日本語対応フォント) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans JP', 'Inter', system-ui, sans-serif;
    }
  </style>
</head>

  
<body class="bg-gray-50 text-gray-900 antialiased">
  <div id="header"></div>

  <!-- メインコンテンツ（仮） -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-6">ようこそ、KAITOの世界へ</h1>
    <p class="text-xl text-gray-600 max-w-3xl">
      ここでは日々の気づきや技術的なメモ、旅の記録などをゆるく書いています。
    </p>
    <!-- ここに記事カードなどを後で追加 -->
  </main>

  <div id="footer"></div>

  <!-- JavaScript（言語切り替え + モバイルメニュー） -->
  <script>
    fetch("./components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
 
      // header挿入後にイベント登録
      const btn = document.getElementById('mobile-menu-btn');
      const menu = document.getElementById('mobile-menu');
 
      if (btn && menu) {
        btn.addEventListener('click', () => {
          menu.classList.toggle('hidden');
        });
      }
    })
    .catch(err => console.error("Header load failed:", err));

    fetch("./components/footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    })
    .catch(err => console.error("Footer load failed:", err));

  </script>
</body>
</html>
