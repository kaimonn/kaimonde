<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Articles - KaiMonde</title>
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/kaimonde/css/main.css">
</head>

<body class="bg-gray-50 text-gray-900 antialiased">

  <!-- Header -->
  <div id="header"></div>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <!-- パンくず -->
    <nav class="text-sm text-gray-500 mb-6">
    <a href="/kaimonde/index.html" class="hover:underline">ホーム</a>
    <span class="mx-2">/</span>
    <a href="/kaimonde/pages/articles.html" class="hover:underline">記事一覧</a>
    </nav>

    <!-- タイトル -->
    <section class="mb-6">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Articles</h1>
      <p class="text-gray-600 text-lg">
        都市計画、交通、留学生活、旅行記などの記事一覧です。
      </p>
    </section>

    <!-- カテゴリ選択 -->
    <section class="mb-8">
      <label for="category-filter" class="block text-gray-700 font-medium mb-2">
        カテゴリで絞り込む:
      </label>
      <select id="category-filter" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">すべて</option>
      </select>
    </section>

    <!-- 記事一覧 -->
    <section>
      <div id="articles-list"
           class="grid gap-8 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
      </div>

      <p id="no-articles" class="text-gray-500 mt-8 hidden">
        まだ記事がありません。
      </p>
    </section>

  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <script src="/kaimonde/js/LocationBadge.js"></script>
  <!-- 記事読み込みスクリプト -->
  <script>
    fetch("/kaimonde/data/articles.geojson")
      .then(res => res.json())
      .then(data => {

        const container = document.getElementById("articles-list");
        const emptyMessage = document.getElementById("no-articles");
        const categoryFilter = document.getElementById('category-filter');

        if (!data || !data.features || data.features.length === 0) {
          emptyMessage.classList.remove("hidden");
          return;
        }

        // properties を配列化
        const articles = data.features.map(f => f.properties);

        // 日付の新しい順に並び替え
        articles.sort((a, b) => new Date(b.date) - new Date(a.date));

        // タグ一覧作成
        const allCategories = new Set();
        articles.forEach(a => a.category.forEach(c => allCategories.add(c)));
        Array.from(allCategories).sort().forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          categoryFilter.appendChild(opt);
        });

        // 記事描画関数
        function renderArticles(filterCategory = '') {
          container.innerHTML = '';
          const filtered = articles.filter(a => 
            !filterCategory || a.category.includes(filterCategory)
          );

          if(filtered.length === 0){
            emptyMessage.classList.remove("hidden");
          } else {
            emptyMessage.classList.add("hidden");
          }

          filtered.forEach(article => {
            const card = document.createElement("a");
            card.href = article.url;
            card.className =
              "block bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition duration-200";

            const city = article.city || '';
            const country = article.country || '';
            const location = (city || country) ? `📍 ${city}${city && country ? ', ' : ''}${country}` : '';

            card.innerHTML = `
              <p class="text-sm text-gray-500">
                ${article.date} ・ ${article.category.join(', ')}
              </p>
              <h3 class="text-xl font-semibold mt-2">${article.title}</h3>
              <p class="text-gray-600 mt-3">${article.description}</p>
            `;
              // LocationBadge を作って挿入
              const locBadge = LocationBadge(article.location);
              card.appendChild(locBadge);
            container.appendChild(card);
          });
        }

        // 初期表示
        renderArticles();

        // 絞り込み
        categoryFilter.addEventListener('change', e => renderArticles(e.target.value));

      })
      .catch(err => {
        console.error("Articles load failed:", err);
        document.getElementById("no-articles").classList.remove("hidden");
      });
  </script>

  <!-- 共通コンポーネント -->
  <script src="/kaimonde/js/load-components.js"></script>

</body>
</html>
